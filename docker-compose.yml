name: understanding-nature
services:
  app:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [web]
    working_dir: /usr/share/nginx/html
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.understanding-nature.rule=Host(`understanding-nature.helios.users.ctx7.dev`)'
      - traefik.http.routers.understanding-nature.entrypoints=websecure
      - traefik.http.routers.understanding-nature.tls=true
      - traefik.http.routers.understanding-nature.tls.certresolver=cloudflare
      - 'traefik.http.routers.understanding-nature.tls.domains[0].main=helios.users.ctx7.dev'
      - 'traefik.http.routers.understanding-nature.tls.domains[0].sans=*.helios.users.ctx7.dev'
      - traefik.http.services.understanding-nature.loadbalancer.server.port=80
networks:
  web: { external: true }
